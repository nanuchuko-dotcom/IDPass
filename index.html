<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Payload Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<style>
:root{--bg:#f5f6f4;--card:#fff;--ink:#17201c;--mute:#66726b;--line:#d9dfdb;--acc:#0f7a5c;--acc-ink:#fff;--err:#b3261e;--code:#eef1ee}
@media (prefers-color-scheme:dark){:root{--bg:#121714;--card:#1b231f;--ink:#e8eee9;--mute:#98a59d;--line:#2d3832;--acc:#3ecf9f;--acc-ink:#07261b;--err:#ff8a80;--code:#141a17}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:1.35rem;margin:8px 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--mute);font-size:.92rem}
.opts{display:grid;gap:10px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:block;width:100%}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt b{display:block}.opt span{color:var(--mute);font-size:.85rem}
.opt:active{border-color:var(--acc)}
#cam{display:none;margin-top:14px;position:relative;border-radius:12px;overflow:hidden;background:#000}
#cam video{width:100%;display:block;max-height:60vh;object-fit:cover}
#cam button{position:absolute;right:8px;top:8px;width:auto;padding:6px 12px}
#status{margin:14px 0 0;color:var(--mute);font-size:.9rem;min-height:1.4em}
#status.err{color:var(--err)}
#out{display:none;margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{width:auto;padding:6px 12px;border-radius:999px;font-size:.85rem}
.tabs button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
pre{margin:0;background:var(--code);border-radius:8px;padding:12px;max-height:46vh;overflow:auto;white-space:pre-wrap;word-break:break-all;font:.8rem/1.45 ui-monospace,Menlo,Consolas,monospace}
.meta{color:var(--mute);font-size:.82rem}
.row{display:flex;gap:8px;margin-top:10px}
.row button{text-align:center}
.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
#qrbox{display:none}
#qrctl{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.85rem;color:var(--mute)}
#qrctl select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#qrimg{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:8px;border:1px solid var(--line);background:#fff;image-rendering:pixelated;image-rendering:crisp-edges}
#qrinfo{margin:8px 0 0;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Scan a QR code</h1>
  <p class="sub">Pick how you want to scan. The payload shows here, no other app needed.</p>

  <div class="opts">
    <button class="opt" id="bMini"><b>Mini App scanner</b><span>Opens the camera inside this page</span></button>
    <button class="opt" id="bNative"><b>Telegram scanner</b><span>Uses Telegram's built-in QR popup</span></button>
    <button class="opt" id="bUpload"><b>Upload image</b><span>Choose a screenshot or photo of a QR code</span></button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <div id="cam"><video id="vid" playsinline muted></video><button id="bStop">Stop</button></div>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="out" aria-label="Scan result">
    <div class="meta" id="meta"></div>
    <div class="tabs" role="group" aria-label="Payload format">
      <button data-f="text" aria-pressed="true">Text</button>
      <button data-f="hex" aria-pressed="false">Hex</button>
      <button data-f="b64" aria-pressed="false">Base64</button>
      <button data-f="qr" aria-pressed="false">QR</button>
    </div>
    <img id="pic" alt="Image found in payload" hidden style="max-width:160px;border-radius:8px;margin:0 0 10px;display:block">
    <pre id="payload"></pre>
    <div id="qrbox">
      <div id="qrctl">
        <label for="ecSel">Error correction</label>
        <select id="ecSel">
          <option value="auto">Auto (match scan)</option>
          <option value="L">L</option>
          <option value="M">M</option>
          <option value="Q">Q</option>
          <option value="H">H</option>
        </select>
      </div>
      <img id="qrimg" alt="Re-encoded QR code of the exact payload bytes">
      <div class="meta" id="qrinfo"></div>
    </div>
    <div class="row">
      <button class="primary" id="bCopy">Copy payload</button>
      <button class="primary" id="bSave" style="display:none">Save PNG</button>
      <button class="primary" id="bSend" style="display:none"></button>
      <button id="bClear">Clear</button>
    </div>
  </section>
</main>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

/* ===================== CAMERA SETTINGS =====================
   HOW TO CHANGE: edit the 3 numbers below (CAM_WIDTH, CAM_HEIGHT, DECODE_MAX_WIDTH)
   together, save the file, upload it again to your hosting (GitHub Pages),
   then close and reopen the mini app.

   NOW (4K):    CAM_WIDTH = 3840;  CAM_HEIGHT = 2160;  DECODE_MAX_WIDTH = 2400;
   1440p:       CAM_WIDTH = 2560;  CAM_HEIGHT = 1440;  DECODE_MAX_WIDTH = 2000;
   1080p:       CAM_WIDTH = 1920;  CAM_HEIGHT = 1080;  DECODE_MAX_WIDTH = 1600;

   CAM_WIDTH, CAM_HEIGHT : camera resolution requested from the phone.
   DECODE_MAX_WIDTH      : frames wider than this are shrunk before reading the QR.

   Higher numbers = reads dense QR from farther away, but heavier on the phone.
   Lower numbers  = lighter and more stable. If Telegram freezes or closes while
   scanning, go one step down (4K -> 1440p -> 1080p). If a dense QR stops reading,
   go one step up.
   ============================================================ */
const CAM_WIDTH = 3840;
const CAM_HEIGHT = 2160;
const DECODE_MAX_WIDTH = 2400;

/* UPLOAD IMAGE SETTING (PHONE ONLY - desktop keeps the original method): uploaded photos are shrunk so their longest side is at most this many pixels.
   If the phone shows "Aw, Snap!" when you upload, lower it (1800 -> 1400 -> 1000).
   If a dense QR in an uploaded photo is not found, raise it (1800 -> 2200). */
const UPLOAD_MAX_SIDE = 1800;

/* PHONE CAMERA SETTING (PHONE ONLY - desktop keeps CAM_WIDTH/CAM_HEIGHT/DECODE_MAX_WIDTH above).
   A 4K camera stream is too heavy for many phones inside Telegram (freezes / Telegram closes).
   To test higher on the phone: 1440p -> 2560, 1440, 2000   4K -> 3840, 2160, 2400 */
const PHONE_CAM_WIDTH = 1920;
const PHONE_CAM_HEIGHT = 1080;
const PHONE_DECODE_MAX_WIDTH = 1600;
/* PHONE ONLY: read only the center part of the camera picture (faster, smoother).
   0.8 = center 80% of the picture. Use 1 to read the whole picture.
   If the QR is not read when it fills the whole screen, hold the phone a bit farther or set this to 1. */
const PHONE_CENTER_CROP = 0.8;
/* ========================================================= */

/* Phone = Android/iPhone browser, or Telegram app on Android/iOS. Phones use the lighter upload method (Plan B);
   desktop browsers and Telegram Desktop use the original upload method. */
const IS_PHONE = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || (!!tg && (tg.platform === 'android' || tg.platform === 'ios'));

const $ = id => document.getElementById(id);
const status = (t, err) => { const s=$('status'); s.textContent=t||''; s.className=err?'err':''; };

let result = null, fmt = 'text', stream = null, rafId = 0;

function bytesOf(r){ // r: {text, bytes}
  return r.bytes && r.bytes.length ? r.bytes : new TextEncoder().encode(r.text || '');
}
function extractFan(r){
  const b = bytesOf(r);
  let s=''; for (let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]);
  const m = s.match(/:A:(\d{16})(?!\d)/) || s.match(/(?:^|\D)(\d{16})(?!\d)/);
  if (!m) return null;
  let msg = JSON.stringify({fan:m[1], qr_payload_b64:btoa(s)});
  if (new TextEncoder().encode(msg).length > 4096) msg = JSON.stringify({fan:m[1]}); // sendData limit
  return {fan:m[1], msg};
}
function show(r, source){
  result = r;
  const f = extractFan(r), sb = $('bSend');
  if (f){ sb.style.display=''; sb.textContent='Send '+f.fan+' to bot'; sb._msg=f.msg; }
  else { sb.style.display='none'; sb._msg=null; }
  const b = bytesOf(r);
  $('meta').textContent = source + ' · ' + b.length + ' bytes' +
    (r.textOnly ? ' · text only, may differ from the exact bytes' : ' · exact bytes');
  $('out').style.display = 'block';
  const kind=sniff(b); if (kind) $('meta').textContent += ' · '+kind;
  render();
  $('out').scrollIntoView({behavior:'smooth', block:'nearest'});
  if (tg && tg.HapticFeedback) try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
}
function sniff(b){
  const pic=$('pic'); pic.hidden=true; pic.removeAttribute('src');
  if (b[0]===0xd2 && b[1]===0x84) return 'Looks like a signed CBOR (COSE_Sign1) record';
  if (b.length>16 && b.every(c=>(c>=48&&c<=57)||(c>=65&&c<=90)||(c>=97&&c<=122)||c===45||c===95||c===43||c===47||c===61)){
    try{
      let t=String.fromCharCode(...b.slice(0,2000)).replace(/-/g,'+').replace(/_/g,'/'); t+='='.repeat((4-t.length%4)%4);
      const head=atob(t.slice(0,24));
      if (head.startsWith('RIFF') && head.slice(8,12)==='WEBP'){
        let all=''; b.forEach(c=>all+=String.fromCharCode(c)); all=all.replace(/-/g,'+').replace(/_/g,'/'); all+='='.repeat((4-all.length%4)%4);
        pic.src='data:image/webp;base64,'+all; pic.hidden=false; return 'Base64url-encoded WebP image (shown above)';
      }
      return 'Base64url text';
    }catch(e){}
  }
  return '';
}

/* Exact QR re-encode: raw bytes -> byte-mode QR (no text conversion) */
function normEc(e){
  e = String(e||'').toUpperCase().charAt(0);
  return (e && 'LMQH'.indexOf(e) >= 0) ? e : '';
}
function buildQR(b, wanted){
  let s=''; for (let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); // 1 char = 1 byte
  const order=['H','Q','M','L'];
  let tryList;
  if (wanted==='auto'){
    const start = normEc(result && result.ec) || 'L';
    tryList = order.slice(order.indexOf(start)); // fall back to lower EC if too big
  } else tryList = [wanted];
  for (const ec of tryList){
    try{
      const q = qrcode(0, ec);
      q.addData(s, 'Byte');
      q.make();
      return {q, ec};
    }catch(e){}
  }
  return null;
}
function renderQR(){
  const b = bytesOf(result);
  const img = $('qrimg'), info = $('qrinfo');
  if (typeof qrcode !== 'function'){ img.removeAttribute('src'); info.textContent='QR encoder library failed to load.'; return; }
  const r = buildQR(b, $('ecSel').value);
  if (!r){
    img.removeAttribute('src');
    info.textContent = 'Too large for a QR at this error-correction level (' + b.length + ' bytes). Try a lower level.';
    return;
  }
  const n = r.q.getModuleCount(), quiet = 4;
  const scale = Math.max(3, Math.min(6, Math.floor(1600/(n+quiet*2))));
  const size = (n+quiet*2)*scale;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,size,size);
  x.fillStyle = '#000';
  for (let row=0; row<n; row++) for (let col=0; col<n; col++)
    if (r.q.isDark(row,col)) x.fillRect((col+quiet)*scale,(row+quiet)*scale,scale,scale);
  img.src = c.toDataURL('image/png');
  info.textContent = 'Version ' + ((n-17)/4) + ' · EC ' + r.ec + ' · ' + b.length + ' bytes · byte mode';
}

function render(){
  if (!result) return;
  const isQR = fmt==='qr';
  $('payload').style.display = isQR ? 'none' : '';
  $('qrbox').style.display = isQR ? 'block' : 'none';
  $('bCopy').style.display = isQR ? 'none' : '';
  $('bSave').style.display = isQR ? '' : 'none';
  document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed', x.dataset.f===fmt));
  if (isQR){ renderQR(); return; }
  const b = bytesOf(result);
  let t;
  if (fmt==='hex') t = Array.from(b, x=>x.toString(16).padStart(2,'0')).join(' ');
  else if (fmt==='b64') { let s=''; b.forEach(x=>s+=String.fromCharCode(x)); t = btoa(s); }
  else t = result.text;
  $('payload').textContent = t;
}
document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>{fmt=x.dataset.f;render();});
$('ecSel').onchange = () => { if (fmt==='qr') render(); };
$('bSave').onclick = () => {
  const src = $('qrimg').src;
  if (!src){ status('Nothing to save.', true); return; }
  try{
    const a = document.createElement('a');
    a.href = src; a.download = 'qr-exact.png';
    document.body.appendChild(a); a.click(); a.remove();
    status('If nothing downloaded, long-press the QR image and save it.');
  }catch(e){ status('Long-press the QR image to save it.'); }
};
$('bCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('payload').textContent); status('Copied.'); }
  catch(e){
    const r=document.createRange(); r.selectNodeContents($('payload'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); status('Select and copy the text.');
  }
};
$('bSend').onclick = () => {
  const m = $('bSend')._msg;
  if (!m || !tg || !tg.sendData){ status('Open this page from the bot\'s Scan QR button to send.', true); return; }
  try{ tg.sendData(m); }catch(e){ status('Could not send to bot.', true); }
};
$('bClear').onclick = () => { result=null; $('out').style.display='none'; status(''); };

/* 1. Mini App scanner: camera inside the page */
/* Cheap check for QR finder patterns (dark-light-dark-light-dark = 1:1:3:1:1) on a small frame.
   Phones without a native QR detector use it, so the heavy decoders run only when a QR is really in view. */
function looksLikeQR(d){
  const w=d.width, h=d.height, px=d.data, row=new Uint8Array(w); let hits=0;
  for (let y=2; y<h; y+=3){
    let sum=0;
    for (let x=0; x<w; x++){ const i=(y*w+x)*4, l=(px[i]*77+px[i+1]*150+px[i+2]*29)>>8; row[x]=l; sum+=l; }
    const th=sum/w, runs=[]; let cur=row[0]<th, len=1;
    for (let x=1; x<w; x++){ const b=row[x]<th; if (b===cur) len++; else { runs.push(len); cur=b; len=1; } }
    runs.push(len);
    for (let i=0; i+4<runs.length; i++){
      const a=runs[i], b=runs[i+1], c=runs[i+2], e=runs[i+3], f=runs[i+4], u=(a+b+c+e+f)/7;
      if (u<1.5) continue;
      const t=u*0.6;
      if (Math.abs(a-u)<t && Math.abs(b-u)<t && Math.abs(c-3*u)<3*t && Math.abs(e-u)<t && Math.abs(f-u)<t){ hits++; break; }
    }
    if (hits>=6) return true;
  }
  return false;
}
async function startCam(){
  stopCam();
  try{
    const vc = {facingMode:'environment',width:{ideal:IS_PHONE?PHONE_CAM_WIDTH:CAM_WIDTH},height:{ideal:IS_PHONE?PHONE_CAM_HEIGHT:CAM_HEIGHT}};
    if (IS_PHONE) vc.frameRate = {ideal:30, max:30};   // phone: steady 30 fps
    stream = await navigator.mediaDevices.getUserMedia({video:vc});
    try{ await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
  }catch(e){ status('Camera blocked. Allow camera access, or use another option.', true); return; }
  if (IS_PHONE){ try{
    const tr = stream.getVideoTracks()[0];
    if (/ultra|wide|macro|depth/i.test(tr.label || '')){
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind==='videoinput' && /back|rear|environment/i.test(d.label) && !/ultra|wide|macro|depth|tele/i.test(d.label));
      if (devs.length){
        const s2 = await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:devs[0].deviceId}, width:{ideal:PHONE_CAM_WIDTH}, height:{ideal:PHONE_CAM_HEIGHT}, frameRate:{ideal:30, max:30}}});
        stream.getTracks().forEach(t => t.stop()); stream = s2;
        try{ await stream.getVideoTracks()[0].applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(_){}
      }
    }
  }catch(_){} }
  const v=$('vid'); v.srcObject=stream; await v.play();
  $('cam').style.display='block'; status('Point the camera at the QR code.');
  if (IS_PHONE) getWorker();   // start loading the background decoder now
  const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
  const g=document.createElement('canvas'), gx=g.getContext('2d',{willReadFrequently:true});
  const det = ('BarcodeDetector' in window) ? new BarcodeDetector({formats:['qr_code']}) : null;
  let busy=false, detBroken=false, misses=0, heavyCount=0, useBmp=(IS_PHONE && typeof OffscreenCanvas!=='undefined' && typeof createImageBitmap==='function'); const t0=Date.now();
  const dc=document.createElement('canvas'), dx=dc.getContext('2d');
  const tick = async () => {
    if (!stream) return;
    if (Date.now()-t0 > 90000){ stopCam(); status('Camera stopped after 90 seconds. Tap Mini App scanner to continue.'); return; }
    if (!busy && v.videoWidth){
      busy=true;
      let heavy=false;
      try{
        if (IS_PHONE){
          // phone: cheap checks first; the heavy decoders run only when a QR is really in view
          let pass = true;
          if (det && !detBroken){
            try{
              const ds=Math.min(1,960/v.videoWidth); dc.width=Math.round(v.videoWidth*ds); dc.height=Math.round(v.videoHeight*ds); dx.drawImage(v,0,0,dc.width,dc.height);
              pass = (await det.detect(dc)).length > 0;
            }catch(_){ detBroken = true; }   // detector unavailable on this phone: use the pattern check below
          }
          if (!det || detBroken){
            const gs=Math.min(1, 960/v.videoWidth);
            g.width=Math.round(v.videoWidth*gs); g.height=Math.round(v.videoHeight*gs);
            gx.drawImage(v,0,0,g.width,g.height);
            pass = looksLikeQR(gx.getImageData(0,0,g.width,g.height));
          }
          if (!pass){ misses++; busy=false; rafId=setTimeout(tick, 350 + Math.min(350, misses*50)); return; }   // longer pauses while nothing QR-like is in view
          misses=0;
        }
        heavy=true;
        await new Promise(r => setTimeout(r, 0));   // let the screen repaint before heavy work
        let q;
        if (IS_PHONE){
          let wr = '__fail__';
          if (useBmp){                                    // best path: crop + resize + pixel read all happen off the main thread
            try{
              const crop = (heavyCount++ % 3 === 2) ? 1 : PHONE_CENTER_CROP;   // every 3rd try uses the whole picture
              const sw=Math.round(v.videoWidth*crop), sh=Math.round(v.videoHeight*crop);
              const sx=Math.round((v.videoWidth-sw)/2), sy=Math.round((v.videoHeight-sh)/2);
              const k=Math.min(1, PHONE_DECODE_MAX_WIDTH/sw);
              const bmp = await createImageBitmap(v, sx, sy, sw, sh, {resizeWidth:Math.round(sw*k), resizeHeight:Math.round(sh*k), resizeQuality:'medium'});
              wr = await workerDecodeBmp(bmp);
            }catch(_){ wr = '__fail__'; }
            if (wr === '__fail__') useBmp = false;        // this phone cannot do it: use the previous method from now on
          }
          if (wr === '__fail__'){
            const sc=Math.min(1,PHONE_DECODE_MAX_WIDTH/v.videoWidth);
            c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc); x.drawImage(v,0,0,c.width,c.height);
            wr = await workerDecode(x.getImageData(0,0,c.width,c.height));
          }
          if (!stream) return;                            // Stop was pressed meanwhile
          if (wr === '__fail__') q = await decodeFrame(x.getImageData(0,0,c.width,c.height), true);  // worker unavailable: old way
          else q = wr ? fromWorker(wr) : null;
        } else {
          const sc=Math.min(1,DECODE_MAX_WIDTH/v.videoWidth);
          c.width=Math.round(v.videoWidth*sc); c.height=Math.round(v.videoHeight*sc); x.drawImage(v,0,0,c.width,c.height);
          q = await decodeFrame(x.getImageData(0,0,c.width,c.height), false);
        }
        if (q){ show(q, 'Mini App scanner'); stopCam(); return; }
        if (det && !detBroken){
          const r = await det.detect(IS_PHONE ? c : v);
          if (r.length){ show({text:r[0].rawValue, textOnly:true}, 'Mini App scanner (text only)'); stopCam(); return; }
        }
      }catch(e){}
      busy=false;
    }
    rafId=setTimeout(tick, IS_PHONE ? 400 : 250);
  };
  tick();
}
function stopCam(){
  clearTimeout(rafId);
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  $('cam').style.display='none';
}
function fromJsQR(q){
  const bytes = q.binaryData && q.binaryData.length ? Uint8Array.from(q.binaryData) : null;
  const text = bytes ? new TextDecoder('utf-8').decode(bytes) : q.data;
  return {text, bytes};
}
$('bMini').onclick = startCam;
$('bStop').onclick = () => { stopCam(); status(''); };

/* 2. Telegram native scanner */
let gotQr = false;
if (tg && tg.onEvent){
  tg.onEvent('scanQrPopupClosed', () => {
    if (!gotQr){
      status('Telegram scanner closed without reading the code. Dense codes often fail here, so switching to the Mini App scanner.', true);
      setTimeout(startCam, 600);
    }
  });
}
$('bNative').onclick = () => {
  stopCam(); gotQr = false;
  if (!tg || !tg.showScanQrPopup || !tg.isVersionAtLeast || !tg.isVersionAtLeast('6.4')){
    status('Telegram scanner needs this page opened as a Telegram Mini App (version 6.4+).', true); return;
  }
  tg.showScanQrPopup({text:'Scan a QR code'}, text => {
    gotQr = true;
    try { tg.closeScanQrPopup(); } catch(e){}
    if (!text){ status('Telegram returned an empty result. Try the Mini App scanner or upload an image.', true); return true; }
    show({text}, 'Telegram scanner');
    if (text.indexOf('\uFFFD') >= 0)
      $('meta').textContent += ' · contains binary data that Telegram turned into text, so use Mini App scanner or Upload for exact bytes';
    return true;
  });
};

/* 3. Upload image */
$('bUpload').onclick = () => { stopCam(); $('file').click(); };
async function loadBitmap(f){
  if (!IS_PHONE) return await createImageBitmap(f); // desktop: original method
  let bmp;
  // phone: let the browser shrink the photo WHILE decoding, so a huge camera photo never sits in memory at full size
  try{ bmp = await createImageBitmap(f, {resizeWidth: UPLOAD_MAX_SIDE, resizeQuality: 'medium'}); }
  catch(e0){
  try{ bmp = await createImageBitmap(f); }
  catch(e){
    bmp = await new Promise((res, rej) => {
      const u = URL.createObjectURL(f), im = new Image();
      im.onload = () => { URL.revokeObjectURL(u); res(im); };
      im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
      im.src = u;
    });
  }
  }
  const w = bmp.width, h = bmp.height, k = Math.min(1, UPLOAD_MAX_SIDE/Math.max(w,h));
  if (k >= 1) return bmp;
  const c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return c;
}
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (!IS_PHONE) e.target.value=''; // desktop: original order
  status('Reading image…');
  try{
    const bmp = await loadBitmap(f);
    const r = await decodeBitmap(bmp);
    if (r){ status(''); show(r, 'Uploaded image'); }
    else if (wasmFailed) status('Dense-QR decoder could not download (network). Check your connection and try again.', true);
    else status('No QR code found. Try a sharper, cropped image with the whole code visible.', true);
  }catch(err){ status('Could not read that image file.', true); }
  finally{ if (IS_PHONE){ try{ e.target.value=''; }catch(_){} } }
};
/* zxing wasm loader: fetch the .wasm ourselves from several hosts (local copy first), then hand it to zxing */
const WASM_URLS = [
  'zxing_reader.wasm', // optional: put this file next to the HTML for offline/most reliable use
  'https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm',
  'https://fastly.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm',
  'https://gcore.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm',
  'https://unpkg.com/zxing-wasm@3.1.6/dist/reader/zxing_reader.wasm'
];
let wasmReady = null, wasmFailed = false;
function initWasm(){
  if (wasmReady) return wasmReady;
  wasmReady = (async () => {
    for (const u of WASM_URLS){
      try{
        const r = await fetch(u);
        if (!r.ok) continue;
        const buf = await r.arrayBuffer();
        const h = new Uint8Array(buf, 0, 4);
        if (!(h[0]===0x00 && h[1]===0x61 && h[2]===0x73 && h[3]===0x6d)) continue; // not real wasm (e.g. HTML 404 page)
        ZXingWASM.setZXingModuleOverrides({
          wasmBinary: buf,
          locateFile: (path, prefix) => path.endsWith('.wasm') ? u : prefix + path
        });
        wasmFailed = false;
        return true;
      }catch(e){ console.warn('wasm fetch failed', u, e); }
    }
    throw new Error('zxing wasm could not be downloaded from any host');
  })();
  wasmReady.catch(() => { wasmReady = null; wasmFailed = true; }); // allow retry on next scan
  return wasmReady;
}
/* ===== PHONE ONLY: background decoder (Web Worker) =====
   The heavy QR decoding runs in a separate thread, so the camera preview stays smooth.
   Desktop does not use this. If the worker cannot start, the phone falls back to the old method. */
function workerMain(){
  importScripts('https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js');
  try{ importScripts('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js'); }catch(e){}
  let ready = null, urls = [];
  function init(){
    if (ready) return ready;
    ready = (async () => {
      for (const u of urls){
        try{
          const r = await fetch(u); if (!r.ok) continue;
          const buf = await r.arrayBuffer(), h = new Uint8Array(buf, 0, 4);
          if (!(h[0]===0x00 && h[1]===0x61 && h[2]===0x73 && h[3]===0x6d)) continue;
          ZXingWASM.setZXingModuleOverrides({ wasmBinary: buf, locateFile: (path, prefix) => path.endsWith('.wasm') ? u : prefix + path });
          return true;
        }catch(e){}
      }
      return false;
    })();
    return ready;
  }
  async function decodeBuf(buffer, width, height){
    let q = null;
    try{
      if (await init()){
        const img = new ImageData(new Uint8ClampedArray(buffer), width, height);
        const r = await ZXingWASM.readBarcodes(img, {formats:['QRCode'], tryHarder:true, tryInvert:false, maxNumberOfSymbols:1});
        if (r.length && r[0].bytes && r[0].bytes.length) q = {bytes: Array.from(r[0].bytes), ecc: r[0].eccLevel};
      }
      if (!q && self.jsQR){
        const j = jsQR(new Uint8ClampedArray(buffer), width, height, {inversionAttempts:'dontInvert'});
        if (j) q = {bytes: Array.from(j.binaryData && j.binaryData.length ? j.binaryData : new TextEncoder().encode(j.data))};
      }
    }catch(e){}
    return q;
  }
  self.onmessage = async ev => {
    const m = ev.data;
    if (m.type === 'init'){ urls = m.urls; await init(); self.postMessage({type:'ready'}); return; }
    if (m.type === 'decode'){
      const q = await decodeBuf(m.buffer, m.width, m.height);
      self.postMessage({type:'result', id:m.id, q});
      return;
    }
    if (m.type === 'decodeBmp'){          // picture arrives as an ImageBitmap: pixels are read here, not on the main thread
      let q = null, fail = false;
      try{
        const b = m.bmp, oc = new OffscreenCanvas(b.width, b.height), cx = oc.getContext('2d', {willReadFrequently:true});
        cx.drawImage(b, 0, 0);
        const d = cx.getImageData(0, 0, b.width, b.height);
        if (b.close) b.close();
        q = await decodeBuf(d.data.buffer, b.width, b.height);
      }catch(e){ fail = true; }
      self.postMessage({type:'result', id:m.id, q, fail});
    }
  };
}
let worker = null, workerOk = true, workerSeq = 0; const workerPending = new Map();
function getWorker(){
  if (worker || !workerOk) return worker;
  try{
    const url = URL.createObjectURL(new Blob(['(' + workerMain.toString() + ')()'], {type:'application/javascript'}));
    worker = new Worker(url);
    worker.onmessage = ev => { const m = ev.data; if (m.type === 'result'){ const f = workerPending.get(m.id); if (f){ workerPending.delete(m.id); f(m.fail ? '__fail__' : (m.q || null)); } } };
    worker.onerror = () => { workerOk = false; worker = null; workerPending.forEach(f => f('__fail__')); workerPending.clear(); };
    worker.postMessage({type:'init', urls: WASM_URLS.map(u => new URL(u, location.href).href)});
  }catch(e){ workerOk = false; worker = null; }
  return worker;
}
function workerDecode(imgData){
  return new Promise(resolve => {
    const w = getWorker(); if (!w){ resolve('__fail__'); return; }
    const id = ++workerSeq;
    const t = setTimeout(() => { workerPending.delete(id); resolve(null); }, 12000);
    workerPending.set(id, r => { clearTimeout(t); resolve(r); });
    w.postMessage({type:'decode', id, width:imgData.width, height:imgData.height, buffer:imgData.data.buffer}, [imgData.data.buffer]);
  });
}
function workerDecodeBmp(bmp){
  return new Promise(resolve => {
    const w = getWorker(); if (!w){ try{ bmp.close(); }catch(_){} resolve('__fail__'); return; }
    const id = ++workerSeq;
    const t = setTimeout(() => { workerPending.delete(id); resolve(null); }, 12000);
    workerPending.set(id, r => { clearTimeout(t); resolve(r); });
    w.postMessage({type:'decodeBmp', id, bmp}, [bmp]);
  });
}
function fromWorker(r){
  const bytes = Uint8Array.from(r.bytes);
  const text = new TextDecoder('utf-8').decode(bytes);
  return (r.ecc !== undefined && r.ecc !== null) ? {text, bytes, ec: normEc(r.ecc)} : {text, bytes};
}
/* ===== end background decoder ===== */
/* Shared decoder: zxing-wasm first (handles dense/binary QR), jsQR as backup. Both return exact bytes. */
async function decodeFrame(imgData, light){
  try{
    if (window.ZXingWASM){
      await initWasm();
      const r = await ZXingWASM.readBarcodes(imgData, {formats:['QRCode'], tryHarder:true, tryInvert:!light, maxNumberOfSymbols:1});
      if (r.length && r[0].bytes && r[0].bytes.length){
        const bytes = Uint8Array.from(r[0].bytes);
        return {text:new TextDecoder('utf-8').decode(bytes), bytes, ec:normEc(r[0].eccLevel)};
      }
    }
  }catch(e){ console.warn('zxing failed', e); }
  try{
    const q = jsQR(imgData.data, imgData.width, imgData.height, {inversionAttempts: light ? 'dontInvert' : 'attemptBoth'});
    if (q) return fromJsQR(q);
  }catch(e){}
  return null;
}
async function decodeBitmap(bmp){
  const w=bmp.width, h=bmp.height;
  for (const s of [1, 2, 0.5, 3, 1.5, 0.75]){
    const cw=Math.round(w*s), ch=Math.round(h*s);
    if (cw>(IS_PHONE ? UPLOAD_MAX_SIDE*1.5 : 4000) || ch>(IS_PHONE ? UPLOAD_MAX_SIDE*1.5 : 4000) || cw<200) continue;
    const c=document.createElement('canvas'); c.width=cw; c.height=ch;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.imageSmoothingEnabled = s<1;
    x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);
    x.drawImage(bmp,0,0,cw,ch);
    const q=await decodeFrame(x.getImageData(0,0,cw,ch));
    if (IS_PHONE) c.width=c.height=0; // phone: free memory before the next try
    if (q) return q;
  }
  if ('BarcodeDetector' in window){
    try{
      const r = await new BarcodeDetector({formats:['qr_code']}).detect(bmp);
      if (r.length) return {text:r[0].rawValue, textOnly:true};
    }catch(e){}
  }
  return null;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) stopCam(); });
if (tg && tg.initData) setTimeout(startCam, 400);   // opened from the bot's Scan QR button: camera starts automatically
