<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fayda QR Scanner</title>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b1220; --surface: #141d30; --line: #22304a;
    --primary: #2f6df6; --text: #f4f7fb; --muted: #93a1b8; --ok: #34d399; --err: #f87171; --scan: #5cc8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; flex-direction: column; }
  header { padding: 16px; text-align: center; }
  h1 { font-size: 18px; font-weight: 700; }
  .sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
  
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 16px; }
  
  .cam { position: relative; width: min(300px, 85vw); aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #000; box-shadow: 0 0 0 1px var(--line); }
  .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  
  .reticle { position: absolute; inset: 15%; pointer-events: none; z-index: 3; }
  .reticle i { position: absolute; width: 24px; height: 24px; border: 4px solid var(--scan); }
  .reticle i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
  .reticle i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
  .reticle i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
  .reticle i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
  .reticle b { position: absolute; left: 4%; right: 4%; height: 3px; background: var(--scan); box-shadow: 0 0 10px var(--scan); animation: sweep 2s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 8%; } to { top: 90%; } }

  .status { width: 100%; max-width: 320px; padding: 10px; border-radius: 10px; font-size: 13px; text-align: center; display: none; }
  .status.show { display: block; }
  .status.info { background: rgba(47,109,246,0.15); color: #a9c4ff; }
  .status.error { background: rgba(248,113,113,0.15); color: #fecaca; }
  .status.success { background: rgba(52,211,153,0.15); color: #34d399; }

  nav { padding: 16px; display: flex; gap: 10px; }
  button { flex: 1; height: 50px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>Fayda QR Scanner</h1>
  <p class="sub">Align card QR code inside the frame</p>
</header>

<main>
  <div class="cam">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <div class="reticle"><i></i><i></i><i></i><i></i><b></b></div>
  </div>
  <div class="status" id="status"></div>
</main>

<nav>
  <button id="captureBtn" type="button">Capture & Scan</button>
</nav>

<script>
(function () {
  let tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
  }

  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token') || '';
  const userId = urlParams.get('uid') || urlParams.get('user_id') || '';

  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const captureBtn = document.getElementById('captureBtn');
  let scanning = false;
  let scanInterval = null;

  function setStatus(msg, type = 'info') {
    statusEl.textContent = msg;
    statusEl.className = `status show ${type}`;
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  }).then(stream => {
    video.srcObject = stream;
    video.play();
    setStatus('Camera active. Scanning automatically...', 'info');
    startAutoScan();
  }).catch(err => {
    setStatus('Camera access blocked or unavailable.', 'error');
  });

  function sendFrameToServer() {
    if (scanning) return;
    if (!video.videoWidth || !video.videoHeight) return;

    scanning = true;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageB64 = canvas.toDataURL('image/jpeg', 0.92);

    fetch('https://tp-pro.up.railway.app/miniapp/qr/scan', {
      method: 'POST',
      headers: {
        'accept': '*/*',
        'content-type': 'application/json'
      },
      body: JSON.stringify({
        image_b64: imageB64,
        token: token,
        user_id: userId
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        setStatus('QR Code detected successfully!', 'success');
        if (scanInterval) clearInterval(scanInterval);
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        setTimeout(() => {
          if (tg && typeof tg.close === 'function') tg.close();
        }, 1500);
      } else {
        scanning = false;
      }
    })
    .catch(err => {
      scanning = false;
    });
  }

  function startAutoScan() {
    scanInterval = setInterval(sendFrameSaver, 600);
  }

  function sendFrameSaver() {
    if (!scanning) sendFrameToServer();
  }

  captureBtn.onclick = function() {
    sendFrameToServer();
  };
})();
</script>
</body>
</html>
